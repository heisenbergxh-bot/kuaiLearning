[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kuailearning-api"
version = "0.1.0"
description = "KuaiLearning learning backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography>=43,<51",
  "agentscope==1.0.21",
  "alembic>=1.14,<2",
  "asyncmy>=0.2.10,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "fastembed>=0.7,<1",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  # AgentScope 1.0.21 imports tqdm at package import time but omits it.
  "tqdm>=4.67,<5",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["agentscope", "agentscope.*", "fitz", "fitz.*"]
follow_imports = "skip"
ignore_missing_imports = true
